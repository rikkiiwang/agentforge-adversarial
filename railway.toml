[build]
builder = "NIXPACKS"

[deploy]
# `sh -c` so $PORT (Railway-injected) is expanded; Streamlit rejects the
# literal string otherwise. --server.address 0.0.0.0 + --server.headless
# are required for Railway's container networking + non-interactive boot.
startCommand = "sh -c 'streamlit run dashboard/app.py --server.port ${PORT} --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
